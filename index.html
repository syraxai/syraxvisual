<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050708">
<title>SYRAX Ads</title>
<meta name="description" content="SYRAX Ads — da ideia ao anúncio pronto com IA.">
<style>
:root{--bg:#050708;--panel:#0b1013;--panel2:#10171b;--line:#1b272d;--text:#f4f8fa;--muted:#8798a2;--cyan:#29d9ff;--lime:#c9ff5f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 78% -10%,rgba(41,217,255,.10),transparent 34%),var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}button,input,textarea,select{font:inherit}.shell{width:min(1120px,calc(100% - 36px));margin:auto}.nav{height:82px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;letter-spacing:.15em}.brand b{color:var(--cyan)}.btn{border:0;border-radius:11px;padding:12px 17px;font-weight:750;cursor:pointer}.primary{background:var(--cyan);color:#031015}.ghost{background:#11181b;color:#eef7fa;border:1px solid #26343b}.hero{padding:80px 0 70px;text-align:center}.tag{font-size:11px;letter-spacing:.22em;color:var(--cyan);font-weight:800}.hero h1{font-size:clamp(48px,8vw,86px);line-height:.95;letter-spacing:-.055em;margin:18px auto;max-width:900px}.hero h1 span{color:var(--cyan)}.hero p{color:#a9b6bd;font-size:18px;line-height:1.6;max-width:720px;margin:24px auto}.actions{display:flex;justify-content:center;gap:10px;margin:32px 0 54px}.demo{max-width:900px;margin:auto;text-align:left;padding:22px;border-radius:22px;border:1px solid #24343c;background:linear-gradient(180deg,#0d1418,#090d0f);box-shadow:0 35px 90px #0008}.shots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.shot{padding:16px;border-radius:13px;background:#0c1215;border:1px solid var(--line)}.shot small{display:block;color:var(--muted);margin-top:5px}.result{display:flex;justify-content:space-between;align-items:center;padding:16px;border:1px solid #1a4c59;border-radius:13px;background:#0a1519}.result span{color:var(--cyan)}.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:50px 0 90px}.plan{padding:24px;border:1px solid var(--line);background:var(--panel);border-radius:17px}.plan.featured{border-color:#29d9ff66;background:linear-gradient(180deg,#0b191d,#0b1013)}.plan h3{font-size:32px;margin:10px 0}.plan p{color:var(--muted)}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px}.card{width:min(420px,100%);background:#0b1013;border:1px solid #26343b;border-radius:19px;padding:25px}.card h2{margin:24px 0 8px}.card p{color:var(--muted)}label{display:grid;gap:6px;margin:12px 0;color:#cbd5da;font-size:12px}input,textarea,select{width:100%;background:#070b0d;border:1px solid #27353c;border-radius:10px;color:#f4f8fa;padding:12px;outline:none}.msg{min-height:18px;color:var(--muted);font-size:12px;margin-top:10px}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:22px 14px;background:#070a0c}.side .brand{padding:8px 10px 26px}.side button{width:100%;text-align:left;background:transparent;border:0;color:#8ea0aa;border-radius:10px;padding:11px 12px;margin:2px 0;cursor:pointer}.side button.active,.side button:hover{background:#11181b;color:#fff}.main{min-width:0}.top{height:88px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px}.top h1{font-size:24px;margin:0}.balance{border:1px solid var(--line);border-radius:11px;padding:9px 12px;background:#0a0f11}.balance b{color:var(--cyan)}.content{padding:28px 30px}.welcome{padding:34px;border:1px solid #23343c;border-radius:20px;background:linear-gradient(125deg,#0e171b,#081013)}.welcome h2{font-size:38px;margin:9px 0}.welcome p{color:#a6b4bb}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.metric,.project,.panel{padding:19px;border:1px solid var(--line);border-radius:15px;background:var(--panel)}.metric small,.project small{color:var(--muted)}.metric strong{display:block;font-size:28px;margin:7px 0}.section-title{display:flex;justify-content:space-between;align-items:center;margin:28px 0 12px}.section-title h2{margin:0}.project h3{margin:8px 0}.create{display:grid;grid-template-columns:minmax(0,760px) 280px;gap:18px}.form{display:grid;gap:14px}.three{display:grid;grid-template-columns:1.3fr .7fr .8fr;gap:10px}.cost{padding:14px;border:1px solid #1b3d47;border-radius:11px;background:#091217;display:flex;justify-content:space-between}.cost b{color:var(--cyan)}.error{color:#ff7988}.ok{color:var(--lime)}@media(max-width:800px){.plans,.shots,.grid{grid-template-columns:1fr}.app{grid-template-columns:1fr}.side{display:flex;position:fixed;z-index:5;bottom:0;left:0;right:0;border-right:0;border-top:1px solid var(--line);padding:7px}.side .brand{display:none}.side button{font-size:11px;text-align:center}.main{padding-bottom:65px}.top{padding:16px 18px;height:auto}.content{padding:20px 18px}.create{grid-template-columns:1fr}.three{grid-template-columns:1fr}.hero{padding-top:45px}.actions{flex-direction:column}}
</style>
</head>
<body><div id="root"></div>
<script type="module">
import {getUser,login,logout,signup,handleAuthCallback} from "https://esm.sh/@netlify/identity?bundle";
const root=document.querySelector("#root");
let state={user:null,account:null,projects:[],view:"dashboard"};
const api=async(path,opt={})=>{const r=await fetch(path,{...opt,headers:{"Content-Type":"application/json",...(opt.headers||{})}});const b=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(b.error||"Erro na solicitação");e.status=r.status;throw e}return b};
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function landing(){root.innerHTML='<main><nav class="nav shell"><div class="brand">SYRAX <b>ADS</b></div><button class="btn ghost" data-auth="login">Entrar</button></nav><section class="hero shell"><div class="tag">IA PARA CAMPANHAS COMERCIAIS</div><h1>Da ideia ao <span>anúncio pronto.</span></h1><p>Planeje, gere, aprove cenas e entregue vídeos comerciais em um único fluxo.</p><div class="actions"><button class="btn primary" data-auth="signup">Começar agora</button><button class="btn ghost" onclick="document.querySelector(\'.plans\').scrollIntoView({behavior:\'smooth\'})">Ver planos</button></div><div class="demo"><b>Campanha · Agência de viagens</b><div class="shots"><div class="shot">01 · Gancho<small>5s</small></div><div class="shot">02 · Destino<small>7s</small></div><div class="shot">03 · Oferta<small>8s</small></div><div class="shot">04 · CTA<small>5s</small></div></div><div class="result"><div><b>Vídeo final</b><small>25s · 9:16 · pronto para publicar</small></div><span>Exportar MP4</span></div></div></section><section class="plans shell"><article class="plan"><b>Start</b><h3>R$ 99</h3><p>Omni Flash, créditos mensais e projetos.</p></article><article class="plan featured"><b>Pro</b><h3>R$ 199</h3><p>Mais modelos, mais créditos e upscale.</p></article><article class="plan"><b>Agência</b><h3>R$ 349</h3><p>Maior franquia e múltiplos clientes.</p></article></section></main><div id="modal"></div>'}
function authModal(mode){document.querySelector("#modal").innerHTML='<div class="modal"><div class="card"><div class="brand">SYRAX <b>ADS</b></div><h2>'+(mode==="signup"?"Criar conta":"Entrar")+'</h2><p>'+(mode==="signup"?"Comece com créditos de teste.":"Acesse seus projetos e créditos.")+'</p><form id="authForm" data-mode="'+mode+'">'+(mode==="signup"?'<label>Nome<input name="name" required></label>':'')+'<label>E-mail<input name="email" type="email" required></label><label>Senha<input name="password" type="password" minlength="8" required></label><button class="btn primary" style="width:100%" type="submit">'+(mode==="signup"?"Criar conta":"Entrar")+'</button><div class="msg" id="authMsg"></div></form><button class="btn ghost" style="width:100%;margin-top:8px" data-close>Fechar</button></div></div>'}
function nav(){return '<aside class="side"><div class="brand">SYRAX <b>ADS</b></div>'+["dashboard","create","projects","credits"].map(v=>'<button class="'+(state.view===v?"active":"")+'" data-view="'+v+'">'+({dashboard:"Visão geral",create:"Criar anúncio",projects:"Projetos",credits:"Créditos"}[v])+'</button>').join("")+'<button data-logout>Sair</button></aside>'}
function top(title){return '<header class="top"><h1>'+title+'</h1><div class="balance">Saldo: <b>'+Number(state.account?.credits_balance||0).toLocaleString("pt-BR")+' créditos</b></div></header>'}
function projectCards(){if(!state.projects.length)return '<div class="panel">Nenhum projeto ainda. Crie sua primeira campanha.</div>';return '<div class="grid">'+state.projects.map(p=>'<article class="project"><small>'+esc(p.kind)+'</small><h3>'+esc(p.name)+'</h3><small>'+new Date(p.updated_at).toLocaleDateString("pt-BR")+'</small></article>').join("")+'</div>'}
function dashboard(){return top("Visão geral")+'<section class="content"><div class="welcome"><div class="tag">NOVO PROJETO</div><h2>O que vamos anunciar hoje?</h2><p>Gere uma peça rápida ou monte uma campanha completa.</p><button class="btn primary" data-view="create">Criar anúncio</button></div><div class="grid"><div class="metric"><small>Créditos disponíveis</small><strong>'+state.account.credits_balance+'</strong><span>Plano '+esc(state.account.plan)+'</span></div><div class="metric"><small>Projetos</small><strong>'+state.projects.length+'</strong><span>Salvos na conta</span></div><div class="metric"><small>Fluxo</small><strong>1</strong><span>Criação rápida ativa</span></div></div><div class="section-title"><h2>Projetos recentes</h2></div>'+projectCards()+'</section>'}
function create(){return top("Criar anúncio")+'<section class="content create"><div class="panel"><form id="generateForm" class="form"><label>Descreva o anúncio<textarea name="prompt" rows="7" required placeholder="Ex.: anúncio vertical de pacote para Gramado, clima romântico, hotel, passeio e CTA para WhatsApp"></textarea></label><div class="three"><label>Modelo<select name="model" id="model"><option value="omni-flash">Omni Flash 1.1</option><option value="seedance">Seedance · Pro</option></select></label><label>Duração<select name="duration" id="duration"><option>5</option><option>8</option><option selected>10</option></select></label><label>Formato<select name="aspect"><option>9:16</option><option>16:9</option></select></label></div><div class="cost"><span>Custo estimado</span><b id="estimate">70 créditos</b></div><button class="btn primary" type="submit">Gerar anúncio</button><div class="msg" id="genMsg"></div></form></div><aside class="panel"><div class="tag">CONTROLE DE CUSTO</div><h2>Sem surpresa no saldo.</h2><p style="color:var(--muted)">O servidor verifica o plano e os créditos antes de chamar o provedor. A chave da API nunca fica no navegador.</p></aside></section>'}
function projects(){return top("Projetos")+'<section class="content"><div class="section-title"><h2>Seus projetos</h2><button class="btn primary" id="newProject">Nova campanha</button></div>'+projectCards()+'<div id="projectBox"></div></section>'}
function credits(){return top("Créditos")+'<section class="content"><div class="welcome"><div class="tag">SALDO</div><h2>'+state.account.credits_balance+' créditos</h2><p>Os Créditos SYRAX são sua moeda interna e não precisam corresponder 1:1 ao provedor.</p></div><div class="plans"><article class="plan"><b>Start</b><h3>R$ 99</h3></article><article class="plan featured"><b>Pro</b><h3>R$ 199</h3></article><article class="plan"><b>Agência</b><h3>R$ 349</h3></article></div></section>'}
function render(){const views={dashboard,create,projects,credits};root.innerHTML='<div class="app">'+nav()+'<main class="main">'+(views[state.view]||dashboard)()+'</main></div>'}
async function load(){const [me,p]=await Promise.all([api("/api/me"),api("/api/projects")]);state.account=me.account;state.projects=p.projects||[]}
document.addEventListener("click",async e=>{const a=e.target.closest("[data-auth]");if(a)return authModal(a.dataset.auth);if(e.target.closest("[data-close]"))return document.querySelector("#modal").innerHTML="";const v=e.target.closest("[data-view]");if(v){state.view=v.dataset.view;render();return}if(e.target.closest("[data-logout]")){await logout();state.user=null;landing();return}if(e.target.id==="newProject"){document.querySelector("#projectBox").innerHTML='<div class="panel" style="margin-top:14px"><form id="projectForm" class="form"><label>Nome da campanha<input name="name" required></label><label>Oferta<textarea name="offer" rows="3"></textarea></label><button class="btn primary">Salvar campanha</button><div class="msg" id="projectMsg"></div></form></div>'}});
document.addEventListener("change",e=>{if(e.target.id==="model"||e.target.id==="duration"){const m=document.querySelector("#model").value,d=Number(document.querySelector("#duration").value);document.querySelector("#estimate").textContent=((m==="omni-flash"?7:10)*d)+" créditos"}});
document.addEventListener("submit",async e=>{if(e.target.id==="authForm"){e.preventDefault();const f=new FormData(e.target),m=e.target.dataset.mode,msg=document.querySelector("#authMsg");try{if(m==="signup"){await signup(f.get("email"),f.get("password"),{full_name:f.get("name")});msg.className="msg ok";msg.textContent="Conta criada. Confira seu e-mail para confirmar."}else{await login(f.get("email"),f.get("password"));state.user=await getUser();await load();render()}}catch(err){msg.className="msg error";msg.textContent=err.message}}if(e.target.id==="projectForm"){e.preventDefault();const f=new FormData(e.target),msg=document.querySelector("#projectMsg");try{const r=await api("/api/projects",{method:"POST",body:JSON.stringify({name:f.get("name"),kind:"campaign",brief:{offer:f.get("offer")}})});state.projects.unshift(r.project);render()}catch(err){msg.textContent=err.message}}if(e.target.id==="generateForm"){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),msg=document.querySelector("#genMsg");msg.textContent="Validando...";try{const r=await api("/api/generate",{method:"POST",body:JSON.stringify(f)});msg.className="msg ok";msg.textContent=r.message;await load()}catch(err){msg.className="msg error";msg.textContent=err.message}}});
try{await handleAuthCallback()}catch{}state.user=await getUser();if(state.user){try{await load();render()}catch{landing()}}else landing();
</script></body></html>
